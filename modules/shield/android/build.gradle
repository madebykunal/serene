plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.shield'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.shield"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}
